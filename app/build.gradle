plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'emplay.entertainment.emplay'
    compileSdk 35

    defaultConfig {
        applicationId "emplay.entertainment.emplay"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/androidx.cardview_cardview.version']
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_KEY", "\"${localProperties['API_KEY']}\""
            buildConfigField "String", "APP_TOKEN", "\"${localProperties['APP_TOKEN']}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_KEY", "\"\""
            buildConfigField "String", "APP_TOKEN", "\"${localProperties['APP_TOKEN']}\""
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'NotificationPermission'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    //noinspection LoginCredentials
    implementation 'com.google.firebase:firebase-auth:24.1.0'
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.google.firebase:firebase-firestore:26.3.0'
    //noinspection LoginCredentials
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    //noinspection LoginCredentials
    implementation 'androidx.credentials:credentials:1.6.0'
    //noinspection LoginCredentials
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    //noinspection LoginCredentials
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0"
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.github.bumptech.glide:annotations:5.0.7'
    implementation "com.github.bumptech.glide:okhttp3-integration:5.0.7"
    
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.smarteist:Android-Image-Slider:1.4.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
